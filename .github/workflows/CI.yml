name: CI
env:
  DEBUG: napi:*
  APP_NAME: clipboard
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  RUST_TOOLCHAIN: '1.99.1'
  NPM_VERSION: '12.2.0'
  ZERO_AR_DATE: '1'
permissions:
  contents: read
'on':
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release to npm'
        required: false
        default: false
        type: boolean
      github_release:
        description: 'Publish GitHub Release'
        required: false
        default: false
        type: boolean
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: cargo fmt -- --check
      - run: cargo clippy --locked -- -D warnings

  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-15-intel
            target: x86_64-apple-darwin
          - host: windows-2025
            target: x86_64-pc-windows-msvc
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cross: --use-napi-cross
          - host: macos-15
            target: aarch64-apple-darwin
          - host: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: --use-napi-cross
          - host: windows-2025
            target: aarch64-pc-windows-msvc
    name: Build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.settings.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            target/
          key: ${{ matrix.settings.host }}-${{ matrix.settings.target }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build --target ${{ matrix.settings.target }} ${{ matrix.settings.cross }} -- --locked
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error
      - name: Upload generated entry points
        if: matrix.settings.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: bindings-js
          path: |
            index.js
            index.d.ts
          if-no-files-found: error

  package:
    name: Package release artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec napi create-npm-dirs
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: artifacts
      - name: Install pinned npm for packing
        run: npm install --global npm@"$NPM_VERSION" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Prepare and pack all platform packages
        run: |
          pnpm artifacts
          cp artifacts/bindings-js/index.js artifacts/bindings-js/index.d.ts .
          pnpm exec napi pre-publish -t npm --skip-optional-publish --no-gh-release
          node scripts/check-release.cjs
          node scripts/pack-release.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: packages/*
          if-no-files-found: error

  test-macOS-windows-binding:
    name: Test ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs: package
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-2025
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
            architecture: arm64
          - host: macos-15
            target: aarch64-apple-darwin
            architecture: arm64
          - host: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x64
        node: ['24']
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          architecture: ${{ matrix.settings.architecture }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      - name: Install and verify packed binding
        run: node scripts/install-test-package.cjs
      - name: Check system clipboard access
        run: node scripts/check-clipboard-env.cjs
      - run: pnpm test

  test-linux-binding:
    name: Test ${{ matrix.target }} - node@${{ matrix.node }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            node: '24'
          - host: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            node: '24'
          # Reuse the same Node-API binary for a lower-version compatibility check.
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            node: '22'
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install virtual clipboard display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth x11-utils
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      - name: Install and verify packed binding
        run: node scripts/install-test-package.cjs
      - name: Test bindings
        run: >-
          xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24 -nolisten tcp'
          bash -c 'node scripts/check-clipboard-env.cjs && pnpm test'
        env:
          XDG_SESSION_TYPE: x11
          WAYLAND_DISPLAY: ''
          WAYLAND_SOCKET: ''

  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs:
      - lint
      - test-macOS-windows-binding
      - test-linux-binding
    if: github.ref == 'refs/heads/main' && (inputs.publish || inputs.github_release)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - name: Install npm for trusted publishing
        if: inputs.publish
        run: |
          npm install --global npm@"$NPM_VERSION" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npm --version
      - name: Download tested release packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      - name: Publish platform packages
        if: inputs.publish
        run: node scripts/publish-packages.cjs platforms
      - name: Publish main package
        if: inputs.publish
        run: node scripts/publish-packages.cjs main
      - name: Publish GitHub Release
        if: inputs.github_release
        run: node scripts/github-release.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
