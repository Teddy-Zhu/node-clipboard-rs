name: CI
env:
  DEBUG: napi:*
  APP_NAME: clipboard
  MACOSX_DEPLOYMENT_TARGET: '10.13'
permissions:
  contents: read
'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release to npm'
        required: false
        default: false
        type: boolean
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: cargo fmt -- --check
      - run: cargo clippy --locked -- -D warnings

  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-15-intel
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cross: --use-napi-cross
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: --use-napi-cross
          - host: windows-latest
            target: aarch64-pc-windows-msvc
    name: Build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            target/
          key: ${{ matrix.settings.host }}-${{ matrix.settings.target }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build --target ${{ matrix.settings.target }} ${{ matrix.settings.cross }} -- --locked
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error
      - name: Upload generated entry points
        if: matrix.settings.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: bindings-js
          path: |
            index.js
            index.d.ts
          if-no-files-found: error

  test-macOS-windows-binding:
    name: Test ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
            architecture: arm64
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
          - host: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x64
        node: ['20', '22', '24']
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          architecture: ${{ matrix.settings.architecture }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: bindings-js
          path: .
      - name: Check system clipboard access
        run: node scripts/check-clipboard-env.cjs
      - run: pnpm test

  test-linux-binding:
    name: Test ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
        node: ['20', '22', '24']
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install virtual clipboard display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth x11-utils
      - uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: bindings-js
          path: .
      - name: Test bindings
        run: >-
          xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24 -nolisten tcp'
          bash -c 'node scripts/check-clipboard-env.cjs && pnpm test'
        env:
          XDG_SESSION_TYPE: x11
          WAYLAND_DISPLAY: ''
          WAYLAND_SOCKET: ''

  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs:
      - lint
      - test-macOS-windows-binding
      - test-linux-binding
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - name: Create npm directories
        run: pnpm exec napi create-npm-dirs
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect bindings and generated entry points
        run: |
          pnpm artifacts
          cp artifacts/bindings-js/index.js artifacts/bindings-js/index.d.ts .
          pnpm exec napi pre-publish -t npm --skip-optional-publish --no-gh-release
          node scripts/check-release.cjs
      - name: Configure npm provenance
        run: npm config set provenance true
      - name: Publish platform packages
        run: pnpm exec napi pre-publish -t npm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify platform packages on npm
        run: |
          node <<'EOF'
          const { execFileSync } = require('node:child_process')
          const { readFileSync } = require('node:fs')

          const RETRIES = 12
          const INTERVAL_MS = 5000
          const pkg = JSON.parse(readFileSync('./package.json', 'utf8'))
          const optionalDeps = pkg.optionalDependencies || {}
          const entries = Object.entries(optionalDeps)

          if (entries.length === 0) {
            throw new Error('No optionalDependencies found in package.json after prepublish')
          }

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

          const fetchPublishedVersion = (name, version) => {
            try {
              const output = execFileSync(
                'npm',
                ['view', `${name}@${version}`, 'version', '--json', '--registry=https://registry.npmjs.org'],
                { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] },
              ).trim()

              const parsed = JSON.parse(output)
              return Array.isArray(parsed) ? parsed[parsed.length - 1] : parsed
            } catch {
              return null
            }
          }

          ;(async () => {
            const failed = []
            for (const [name, version] of entries) {
              let ok = false
              for (let i = 1; i <= RETRIES; i++) {
                const published = fetchPublishedVersion(name, version)
                if (published === version) {
                  console.log(`✅ ${name}@${version} is available`)
                  ok = true
                  break
                }
                console.log(`⏳ waiting ${name}@${version} (${i}/${RETRIES})`)
                if (i < RETRIES) {
                  await sleep(INTERVAL_MS)
                }
              }
              if (!ok) {
                failed.push(`${name}@${version}`)
              }
            }

            if (failed.length > 0) {
              console.error('❌ Missing platform packages on npm:')
              for (const item of failed) {
                console.error(`  - ${item}`)
              }
              process.exit(1)
            }

            console.log('✅ All platform packages are visible on npm')
          })().catch((err) => {
            console.error(err)
            process.exit(1)
          })
          EOF
      - name: Publish main package
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
