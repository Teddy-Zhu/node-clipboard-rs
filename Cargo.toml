
[package]
authors      = ["teddyzhu15 <teddyzhu15@gmail.com>"]
edition      = "2024"
name         = "node-clipboard-rs"
publish      = false
rust-version = "1.88"
version      = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64       = "0.23.1"
clipboard-rs = "0.3.5"
napi         = { version = "3.14.2", features = ["async"] }
napi-derive  = "3.6.12"
tokio        = { version = "1.53.3", features = ["rt", "rt-multi-thread"] }
url          = "2.5.8"

# Wayland 读写和监听共用同一套协议实现。
[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9.4"

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto   = true
strip = "symbols"
